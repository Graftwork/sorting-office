# Overrides layered on top of Debian's packaged Dovecot defaults.
# Kept separate from the packaged config rather than editing it in place, so a
# `dpkg` upgrade of dovecot-imapd never silently reverts these.

# IMAP only. dovecot-imapd pulls in dovecot-core, whose default already omits
# pop3 and lmtp, but say it explicitly so this stays true across upgrades.
protocols = imap

# This is a mailbox that only the sweeper ever writes to, over the LAN/tailnet
# (ADR 0001) — no separate mail accounts, one shared vhost namespace.
mail_location = maildir:/var/mail/vhosts/%u
mail_uid = vmail
mail_gid = vmail

# TLS termination and real credentials are deployment configuration for the
# mini PC, not this base image — see infra/README.md.
disable_plaintext_auth = no
ssl = no

passdb {
  driver = passwd-file
  args = scheme=CRYPT username_format=%u /etc/dovecot/users
}
userdb {
  driver = static
  args = uid=vmail gid=vmail home=/var/mail/vhosts/%u
}
