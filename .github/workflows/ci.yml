name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # mise reads mise.toml, so CI and a laptop run the same pinned versions.
      # `minimum_release_age` is not a pin — mise.toml's own tool versions
      # stay unaffected, and this still always moves forward to whatever is
      # newest once it clears the age threshold. It only guards against the
      # brand-new mise binary itself (mise-action's own default resolution,
      # separate from mise.toml) shipping with release assets that 404 for a
      # few days after publish. `7d` matches mise-action's own documented
      # example for this input; see Stock's CHANGELOG v0.4.0 for the failure
      # this fixes upstream (a 404 fetching a mise release asset immediately
      # after that release went out).
      - uses: jdx/mise-action@v4
        with:
          cache: true
          minimum_release_age: 7d

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest

      # Non-blocking on purpose: a freshly stamped repo is green before
      # CODECOV_TOKEN exists. Add the secret and the badge goes live.
      # See docs/decisions/0003-coverage-reporting.md.
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
        continue-on-error: true
