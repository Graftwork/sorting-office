name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # mise reads mise.toml, so CI and a laptop run the same pinned versions.
      # The mise binary itself is pinned too (`version`). Left to resolve the
      # release, the action calls the GitHub API, and Stock measured that
      # failing twice before any step of its own ran: a brand-new release whose
      # asset 404ed (`minimum_release_age: 7d` answered that), and then a
      # `mise self-update` rate limited with HTTP 403 when the cache held an
      # older mise (Graftwork/stock PRs #14, #15 and #57; see its CHANGELOG
      # v0.7.0). A pinned version skips resolution, and `minimum_release_age`
      # (which the action applies only when `version` is not set, per its
      # action.yml) is no longer needed.
      # 2026.9.12 is what this repository's cache held: the log of this
      # workflow's run on the v0.6.0 re-sync PR (#26) reads "mise already
      # installed (2026.9.12), but different version requested (2026.9.15)".
      # To upgrade, change `version` here, once the release is a few days old,
      # and check the first CI run on a cold cache.
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.12
          cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest

      # Non-blocking on purpose: a freshly stamped repo is green before
      # CODECOV_TOKEN exists. Add the secret and the badge goes live.
      # See docs/decisions/0003-coverage-reporting.md.
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
        continue-on-error: true
