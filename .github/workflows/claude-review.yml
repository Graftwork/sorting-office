name: Claude Code Review

# Automatically review pull requests with Claude when they are opened or marked
# ready for review. Authentication uses a Claude subscription OAuth token stored
# in the CLAUDE_CODE_OAUTH_TOKEN repository secret, so reviews draw on the
# existing Claude plan rather than a separate Anthropic API key.
on:
  pull_request:
    types: [opened, ready_for_review]

# Cancel an in-progress review when the same pull request triggers another run,
# so a single PR never consumes subscription quota on overlapping reviews.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip draft pull requests; they are reviewed once marked ready for review.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      # Two checkouts, not one — this workflow is meant to run on fork PRs
      # (every contribution into a repo grafted from Stock, if that repo takes
      # PRs the way Graftwork/stock itself does), which changes the security
      # shape entirely. GitHub withholds secrets from pull_request-triggered
      # runs on fork PRs by default; enabling the private-repo "send secrets to
      # fork pull request workflows" setting fixes that, but only by removing
      # the protection — it does nothing about where the fork's own content
      # ends up. actions/checkout with no ref override, under a plain
      # pull_request trigger (not pull_request_target), checks out the PR's
      # auto-generated merge commit — base *and* fork content combined — so an
      # unpinned checkout still lands untrusted, PR-controlled content at the
      # workspace root, in the same job that now has a live OAuth token in its
      # environment. Confirmed against actions/checkout's own documented
      # default-ref behavior, not assumed.
      #
      # So: pin the root checkout explicitly to the base branch (the only
      # thing that should share a job with secrets), and check out the PR's
      # own head into an isolated pr-head/ subdirectory instead — content
      # Claude is told about explicitly (--add-dir pr-head below) and can
      # read, but that never becomes the executing working tree. On a
      # same-repo PR (no fork involved, secrets already available regardless
      # of the setting above) this costs nothing: both checkouts just end up
      # with the same content.
      - name: Check out the base branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1

      - name: Check out the pull request's own content
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head
          fetch-depth: 1

      - name: Run Claude code review
        # Pinned to a commit SHA, not the floating @v1 tag — this is a
        # different risk from the checkout split above, and one with a real,
        # disclosed precedent specific to this action: PR content (a title, a
        # code comment, hidden text) can instruct the model to use its own
        # legitimately-granted tools — the same comment-posting tools this
        # workflow already needs — to leak the secrets in its own
        # environment, no filesystem access required, so the checkout fix
        # above doesn't touch this vector. Separately, GHSA-8q5r-mmjf-575q /
        # CVE-2026-47751 (a first-party advisory on this action, confirmed
        # directly rather than assumed) describes a related but distinct
        # RCE + secret-exfiltration path via a malicious .mcp.json in PR
        # content, fixed >=1.0.74 — its own recommended mitigation is this
        # same one: pin to a specific version, never a floating tag.
        # 70fec18 is v1.0.207, the latest release as of this pin (2026-08-27),
        # well past both fixes. A floating @v1 tag gives no such guarantee —
        # it silently tracks whatever is newest at run time — and leaves no
        # record of which version actually ran on a given review if either
        # class of bug regresses. Bump this SHA deliberately; treat it like
        # any other dependency version bump, not a set-and-forget default.
        uses: anthropics/claude-code-action@70fec183852c4f82f3f1969faed7dd60c5149ca7 # v1.0.207
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # plugin_marketplaces/plugins are NOT pinned below — this is a known,
          # currently-open gap, not an oversight. The action's own action.yml
          # documents plugin_marketplaces as a plain git URL and plugins as
          # name@marketplace-name; neither documents a ref/SHA-pinning syntax,
          # and guessing at an undocumented git-URL-fragment convention here
          # risks silently doing nothing while looking fixed. Until a
          # documented pin mechanism is confirmed (or this marketplace is
          # forked/vendored at a known commit instead), the plugin content
          # itself tracks anthropics/claude-code's default branch un-pinned.
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # --add-dir pr-head: the PR's own content, checked out above, isn't
          # the working directory Claude starts in (that's the base-branch
          # checkout) — this is what grants explicit, read access to it.
          #
          # --allowedTools carries two separate grants, needed for two
          # separate reasons. mcp__github_inline_comment__create_inline_comment:
          # without naming it here, the action never starts the MCP server that
          # posts inline PR comments at all — the code-review skill's own
          # allowed-tools frontmatter naming the same tool is not sufficient on
          # its own. Bash(gh pr comment:*): per the command's own source
          # (anthropics/claude-code, plugins/code-review/commands/code-review.md),
          # a clean review with no issues posts its "No issues found" summary via
          # `gh pr comment`, a completely different, Bash-invoked path. Confirmed
          # by a live run grafting this workflow onto stiffneckjim/comic-book-guy
          # (PR #7) that completed with permission_denials_count: 1 and posted
          # nothing — the review ran for real (21s, 5 turns) and found nothing to
          # flag, but was blocked from posting that outcome at all. Re-run with
          # this fix on PR #9 of the same repo posted the "No issues found"
          # comment successfully.
          claude_args: '--add-dir pr-head --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*)"'
          # Dependabot PRs only ever touch dependency-pin lines (pyproject.toml, devcontainer
          # feature versions), so they carry no attacker-controlled content; allow the action to
          # run for them rather than failing every dependency-bump PR's review check.
          allowed_bots: "dependabot"
