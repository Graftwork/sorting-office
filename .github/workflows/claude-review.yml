name: Claude Code Review

# Automatically review pull requests with Claude when they are opened, marked
# ready for review, or pushed to. Authentication uses a Claude subscription
# OAuth token stored in the CLAUDE_CODE_OAUTH_TOKEN repository secret, so
# reviews draw on the existing Claude plan rather than a separate Anthropic API
# key.
#
# `synchronize` (a push to an open PR) is here so the result of the final step
# describes the PR's current head commit, not an older one. The check is
# advisory, not a required check (maintainer decision, Graftwork/stock#39): a
# missing review must never look like a review, but nothing waits on this job.
# Left alone, a push gets no
# second review: the review plugin stops if Claude has already commented on
# the pull request (measured on Graftwork/stock#47; #39 finding 11), the run
# posts nothing, and the gate below goes red. The prompt below therefore tells
# the review to ignore that condition. Whether it does is checked on a live
# run, not assumed; if it does not, the gate still fails, loudly. The
# concurrency group below keeps pushes from overlapping reviews.
on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

# Cancel an in-progress review when the same pull request triggers another run,
# so a single PR never consumes subscription quota on overlapping reviews.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip draft pull requests; they are reviewed once marked ready for review.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      # The denied tool calls, on one line, for the comment job below.
      denied: ${{ steps.gate.outputs.denied }}
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      # Two checkouts, not one — this workflow is meant to run on fork PRs
      # (every contribution into a repo grafted from Stock, if that repo takes
      # PRs the way Graftwork/stock itself does), which changes the security
      # shape entirely. GitHub withholds secrets from pull_request-triggered
      # runs on fork PRs by default; enabling the private-repo "send secrets to
      # fork pull request workflows" setting fixes that, but only by removing
      # the protection — it does nothing about where the fork's own content
      # ends up. actions/checkout with no ref override, under a plain
      # pull_request trigger (not pull_request_target), checks out the PR's
      # auto-generated merge commit — base *and* fork content combined — so an
      # unpinned checkout still lands untrusted, PR-controlled content at the
      # workspace root, in the same job that now has a live OAuth token in its
      # environment. Confirmed against actions/checkout's own documented
      # default-ref behavior, not assumed.
      #
      # So: pin the root checkout explicitly to the base branch (the only
      # thing that should share a job with secrets), and check out the PR's
      # own head into an isolated pr-head/ subdirectory instead — content
      # Claude is told about explicitly (--add-dir pr-head below) and can
      # read, but that never becomes the executing working tree. On a
      # same-repo PR (no fork involved, secrets already available regardless
      # of the setting above) this costs nothing: both checkouts just end up
      # with the same content.
      - name: Check out the base branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1

      - name: Check out the pull request's own content
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head
          fetch-depth: 1

      # The gate at the bottom only counts comments posted after this moment, so
      # a comment left by an earlier run on the same PR cannot satisfy it.
      - name: Record when this review started
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Run Claude code review
        id: review
        # Pinned to a commit SHA, not the floating @v1 tag — this is a
        # different risk from the checkout split above, and one with a real,
        # disclosed precedent specific to this action: PR content (a title, a
        # code comment, hidden text) can instruct the model to use its own
        # legitimately-granted tools — the same comment-posting tools this
        # workflow already needs — to leak the secrets in its own
        # environment, no filesystem access required, so the checkout fix
        # above doesn't touch this vector. Separately, GHSA-8q5r-mmjf-575q /
        # CVE-2026-47751 (a first-party advisory on this action, confirmed
        # directly rather than assumed) describes a related but distinct
        # RCE + secret-exfiltration path via a malicious .mcp.json in PR
        # content, fixed >=1.0.74 — its own recommended mitigation is this
        # same one: pin to a specific version, never a floating tag.
        # 70fec18 is v1.0.207, the latest release as of this pin (2026-08-27),
        # well past both fixes. A floating @v1 tag gives no such guarantee —
        # it silently tracks whatever is newest at run time — and leaves no
        # record of which version actually ran on a given review if either
        # class of bug regresses. Bump this SHA deliberately; treat it like
        # any other dependency version bump, not a set-and-forget default.
        uses: anthropics/claude-code-action@70fec183852c4f82f3f1969faed7dd60c5149ca7 # v1.0.207
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # plugin_marketplaces/plugins are NOT pinned below — this is a known,
          # currently-open gap, not an oversight. The action's own action.yml
          # documents plugin_marketplaces as a plain git URL and plugins as
          # name@marketplace-name; neither documents a ref/SHA-pinning syntax,
          # and guessing at an undocumented git-URL-fragment convention here
          # risks silently doing nothing while looking fixed. Until a
          # documented pin mechanism is confirmed (or this marketplace is
          # forked/vendored at a known commit instead), the plugin content
          # itself tracks anthropics/claude-code's default branch un-pinned.
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # The second paragraph exists so that a push after the first review is
          # reviewed too: the plugin's step 1 stops when Claude has already
          # commented, which would leave the new commits unread behind a red
          # gate. The head SHA is a hex string from the event, safe to inline.
          # The third paragraph exists because the review declines pull requests it
          # judges to have nothing to review and, left alone, posts nothing
          # (measured on an empty commit), which is indistinguishable from a silent
          # failure. The gate below accepts the sentinel only for pull requests with
          # no changed files other than Markdown, so this text cannot be used to
          # talk the review out of reviewing code. Whether the review follows the
          # instruction is checked on a live run, not assumed.
          prompt: |
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            Earlier comments by Claude on this pull request are not a reason to stop: new commits may have been pushed since any earlier review, and this run reviews the current head, ${{ github.event.pull_request.head.sha }}. When you run the step 1 check, leave out the condition about Claude having already commented.

            If the review stops because the pull request has nothing worth reviewing (no file changes, or only documentation changes), post exactly one comment with `gh pr comment` that begins "No reviewable changes" and gives the reason in one sentence, and post nothing else.
          # --add-dir pr-head: the PR's own content, checked out above, isn't
          # the working directory Claude starts in (that's the base-branch
          # checkout) — this is what grants explicit, read access to it.
          #
          # --allowedTools carries three separate grants, needed for three
          # separate reasons. Skill(code-review:code-review): the prompt above
          # runs the review by invoking /code-review:code-review, and invoking
          # any skill goes through the Skill tool — without granting it here,
          # the very first thing this workflow does is denied, before the
          # review ever starts. Scoped to that one skill by its qualified
          # name, not a bare `Skill` grant — documented syntax
          # (docs.claude.com/en/skills.md, "Restrict Claude's skill access":
          # `Skill(name)` for exact match, matching a plugin-qualified name
          # the same way its own example `Skill(anthropic-skills:pdf)` does).
          # A bare grant would pre-approve invoking any other skill too, with
          # no human present — this workflow's own threat model above is
          # attacker-controlled fork-PR content steering the model into
          # misusing tools it already holds, and the plugin marketplace this
          # skill comes from is itself un-pinned (see the comment on
          # plugin_marketplaces above). Confirmed the hard way, twice over:
          # this exact workflow (before this fix) hit
          # permission_denials_count: 1 and posted nothing on its own PR #29
          # in this repository — the fix for that PR's actual subject is
          # unrelated; the review of it silently failed to run at all. A
          # grafted project (Graftwork/talks) hit the identical failure on
          # its own PR #3 and, with a temporary `show_full_output: true`
          # diagnostic, showed the denial was exactly this — `{"tool_name":
          # "Skill", "tool_input": {"skill": "code-review:code-review",
          # ...}}` — as the first entry in permission_denials. This grant is
          # necessary but not sufficient: see `settings` below.
          # mcp__github_inline_comment__create_inline_comment: without naming
          # it here, the action never starts the MCP server that posts inline
          # PR comments at all — the code-review skill's own allowed-tools
          # frontmatter naming the same tool is not sufficient on its own.
          # Bash(gh pr comment:*): per the command's own source
          # (anthropics/claude-code, plugins/code-review/commands/code-review.md),
          # a clean review with no issues posts its "No issues found" summary via
          # `gh pr comment`, a completely different, Bash-invoked path. These two
          # were confirmed independently by an earlier live run grafting this
          # workflow onto stiffneckjim/comic-book-guy (PR #7 failed the same
          # way; PR #9 with this fix posted the "No issues found" comment) —
          # necessary, but not sufficient on their own, which the Graftwork/talks
          # PR #3 and this repository's own PR #29 both went on to show.
          claude_args: '--add-dir pr-head --allowedTools "Skill(code-review:code-review),mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*)"'
          # With the grants above the review still posted nothing: the plugin
          # starts subagents in the background, and this action's single
          # non-interactive turn can end while they are still running, which
          # is reported as `success` with nothing reviewed. Measured in
          # Graftwork/sorting-office (this pinned action version), same code
          # change on two PRs: switch off — 4 of 7 subagents in the
          # background, run ended "still running", nothing posted; switch on —
          # 9 of 9 in the foreground, two inline comments posted. One run per
          # arm, so the effect is observed, not proven repeatable.
          # It goes through `settings`, not a workflow `env:`: the action's
          # Claude step passes only an explicit allowlist of environment
          # variables, and this one is not on it (read from action.yml at the
          # pinned SHA); `settings` is written to ~/.claude/settings.json.
          # A run that ends in a few turns with nothing posted may be the
          # plugin's own first step declining a PR that calls itself a
          # throwaway or "do not merge" — describe test PRs neutrally.
          settings: '{"env": {"CLAUDE_CODE_DISABLE_BACKGROUND_TASKS": "1"}}'
          # Dependabot PRs only ever touch dependency-pin lines (pyproject.toml, devcontainer
          # feature versions), so they carry no attacker-controlled content; allow the action to
          # run for them rather than failing every dependency-bump PR's review check.
          allowed_bots: "dependabot"

      # A green tick has to mean a review happened. The action above reports
      # `success` when Claude is denied a tool, errors out, ends its turn early,
      # or skips itself entirely; every failure this workflow has had ended that
      # way, with nothing posted (Graftwork/stock#39). So check the outcome
      # rather than the exit code. It reads only the action's own output file,
      # the GitHub API, and a byte comparison of the two workflow files; it
      # never executes anything from the pull request.
      #
      # The step fails when: the review bot posted no comment or review since
      # the run started; `is_error` is true; or the PR edits this workflow (the
      # action skips itself). A denied tool call never fails the step by itself;
      # denials are listed. If a denial stops the review from posting, the
      # "posted nothing" rule fails the run and its message lists them. Measured
      # on a review that named both planted bugs: four denied calls, all
      # exploratory (`gh pr diff`, `git ls-tree`, a `python3` trace), different
      # on every run, one of them executing code. Failing on those makes every
      # real review red, and granting them one by one would not converge and
      # would widen the allowlist. An earlier version also failed when a tool
      # the review posts with was denied, by matching the command text for
      # `gh pr comment`; a pull request whose own test file quoted that phrase
      # failed it (measured on Graftwork/stock#56). It added nothing, because
      # a denied posting tool already means nothing was posted.
      #
      # "Nothing to review" is its own explicit outcome, not silence: the prompt
      # asks the review to post a comment beginning with SENTINEL. The gate
      # accepts a sentinel-only run only if the pull request really has no
      # changed files other than Markdown, checked here from the API and never
      # from anything the model said; otherwise text in a pull request could talk
      # the review out of reviewing code. Only comments by the review bot count.
      # The denied-calls comment below and the session-link job post as
      # github-actions[bot], so neither can make a broken run look reviewed.
      - name: Fail unless a review was actually posted
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          STARTED_AT: ${{ steps.started.outputs.at }}
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          # The identity the action comments as: REST `user.login` on the
          # reviews it posted (read from Graftwork/stock#42). GraphQL shows the
          # same account as plain `claude`; this step uses REST.
          REVIEW_BOT: claude[bot]
          # What the review posts when it has nothing to review; see `prompt`.
          SENTINEL: No reviewable changes
        run: |
          set -euo pipefail

          fail() {
            echo "::error title=No review happened::$1"
            echo "### No review happened" >> "$GITHUB_STEP_SUMMARY"
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          # The action refuses to run when this file differs from the default
          # branch's (measured: "Skipping action due to workflow validation",
          # job green in 7 s). Such a pull request is not reviewed by Claude, so
          # this job must not be green for it.
          if ! cmp -s .github/workflows/claude-review.yml pr-head/.github/workflows/claude-review.yml; then
            fail "This pull request edits claude-review.yml, so the action skipped itself and nothing was reviewed. Review it by hand: this check is advisory, so it does not block the merge, but nothing has reviewed this change."
          fi

          if [ -z "${EXECUTION_FILE:-}" ] || [ ! -s "$EXECUTION_FILE" ]; then
            fail "The action produced no execution file, so there is nothing to check."
          fi

          result=$(jq -s 'flatten | map(select(type == "object" and .type == "result")) | last // {}' "$EXECUTION_FILE")
          denials=$(jq -r '.permission_denials_count // ((.permission_denials // []) | length)' <<<"$result")
          is_error=$(jq -r '.is_error // false' <<<"$result")
          turns=$(jq -r '.num_turns // "unknown"' <<<"$result")

          # Denied calls as "tool: start of command" on one line. Backticks and
          # percent signs are replaced and line breaks collapsed, so the text is
          # safe to print in a workflow command and to hand to the comment job.
          fmt='map("\(.tool_name): \((.tool_input.command // .tool_input.skill // "") | gsub("\\s+"; " ") | gsub("[`%]"; "_") | .[0:100])") | join("; ") | .[0:400]'
          denied=$(jq -r "[.permission_denials[]?] | $fmt" <<<"$result")
          # Set before any failure below, so the comment job still gets it.
          echo "denied=$denied" >> "$GITHUB_OUTPUT"

          {
            echo "### Review run"
            echo "- permission denials: $denials"
            echo "- is_error: $is_error"
            echo "- turns: $turns"
            echo "- subagents: $(jq -c '.subagent_stats // {}' <<<"$result")"
            if [ "$denials" != "0" ]; then
              echo "- denied: $denied"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$is_error" = "true" ]; then
            fail "Claude Code reported is_error: true."
          fi

          counts=$(
            {
              gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments"
              gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/comments"
              gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews"
            } | jq -s -c --arg bot "$REVIEW_BOT" --arg since "$STARTED_AT" --arg s "$SENTINEL" '
              [.[][] | select(.user.login == $bot) | select((.created_at // .submitted_at // "") >= $since)]
              | {total: length, sentinel: (map(select((.body // "") | sub("^\\s+"; "") | startswith($s))) | length)}'
          )
          total=$(jq -r '.total' <<<"$counts")
          sentinel=$(jq -r '.sentinel' <<<"$counts")
          echo "- comments by $REVIEW_BOT since $STARTED_AT: $total ($sentinel beginning \"$SENTINEL\")" >> "$GITHUB_STEP_SUMMARY"

          if [ "$total" = "0" ]; then
            detail=""
            if [ "$denials" != "0" ]; then
              detail=" $denials tool call(s) were denied ($denied)."
            fi
            fail "$REVIEW_BOT posted nothing on this pull request, so nothing was reviewed. When it has nothing to review the review is asked to post a comment beginning \"$SENTINEL\"; it did not, so this is a silent failure or that instruction was ignored. It needs a human.$detail"
          fi

          if [ "$total" = "$sentinel" ]; then
            files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')
            other=$(grep -v -i -e '^$' -e '\.md$' <<<"$files" || true)
            if [ -n "$other" ]; then
              first=$(head -n 1 <<<"$other" | tr -d '%' | tr -cd '[:print:]' | cut -c1-80)
              fail "The review said there was nothing to review, but this pull request changes files other than Markdown (first: $first). A review that can be talked out of reviewing code is not a review; read it by hand."
            fi
            echo "- the review declined: nothing to review (no changed files other than Markdown)" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$denials" != "0" ]; then
            echo "::warning title=Tool calls were denied during the review::$denials denied ($denied). The review posted, so this does not fail the check."
          fi

  # Lists the denied tool calls as one comment per pull request, updated in
  # place on each push. A separate job so the job that runs the model keeps a
  # read-only token; this one can write to pull requests and runs nothing from
  # the pull request. Best effort: it never fails the check, and it is skipped
  # for fork pull requests, whose token is read-only.
  denied-calls-comment:
    needs: review
    if: always() && needs.review.outputs.denied != '' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post or update the denied-calls comment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DENIED: ${{ needs.review.outputs.denied }}
        run: |
          set -euo pipefail
          marker='<!-- claude-review-gate:denied-calls -->'
          body=$(printf '%s\n**Review gate:** these tool calls were denied during the automated review. Denials of exploratory commands do not fail the check; they are listed so a review that looks shallower than expected can be explained. The allowlist is deliberately not widened (Graftwork/stock#39).\n\n```\n%s\n```\n' "$marker" "$DENIED")
          ids=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id")
          existing=${ids%%$'\n'*}
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null
          fi
