name: Coding session links

# Cloud coding sessions add a link to the private session to commits and, via
# the GitHub tool, to pull request descriptions. No client-side setting stops
# the second, and a local git hook can be skipped with --no-verify, so this is
# enforced here: the description is cleaned in place, and a pull request whose
# commits carry a link fails. The commit check matches the same pattern as the
# no-session-link pre-commit hook (scripts/check_no_session_link.py):
# claude.ai/code/session, case-insensitive.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  description:
    name: Session link - description
    # Fork pull requests get a read-only token, so they cannot be edited.
    if: >-
      github.event.action != 'synchronize' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Remove session links from the description
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess

          repo, number = os.environ["REPO"], os.environ["NUMBER"]
          endpoint = f"repos/{repo}/pulls/{number}"

          # Read the current body, not the event payload's copy of it: a human
          # edit made after the event fired must not be overwritten.
          body = json.loads(
              subprocess.run(
                  ["gh", "api", endpoint],
                  check=True, capture_output=True, text=True,
              ).stdout
          )["body"] or ""

          u = r"https?://claude\.ai/code/session[^\s)\]>]*"
          if not re.search(u, body, re.IGNORECASE):
              print("No session link in the description.")
              raise SystemExit(0)

          # A line that is only the link (the tool's footer, a Claude-Session
          # trailer, a bare link) is dropped. In any other line the link is
          # removed together with its own markup and nothing else on the line
          # is touched, so indentation, a hard line break and the sentence's
          # words all survive.
          whole = re.compile(
              rf"\s*(?:_?\s*Generated by \[Claude Code\]\(\s*<?{u}>?\s*\)\s*_?"
              rf"|(?:Claude-Session:\s*)?<?{u}>?)\s*",
              re.IGNORECASE,
          )
          # Longest markup first: [text](link) -> text, then (link), <link>, link.
          # The blank before a removed link goes with it, unless it is indent.
          inline = [
              (re.compile(rf"\[([^\]]*)\]\(\s*<?{u}>?\s*\)", re.IGNORECASE), r"\1"),
              (re.compile(rf"(?:(?<=\S)[ \t]+)?\(\s*<?{u}>?\s*\)", re.IGNORECASE), ""),
              (re.compile(rf"(?:(?<=\S)[ \t]+)?<{u}>", re.IGNORECASE), ""),
              (re.compile(rf"(?:(?<=\S)[ \t]+)?{u}", re.IGNORECASE), ""),
          ]
          lines, dropped = [], set()
          orig = body.split("\n")
          for i, line in enumerate(orig):
              if whole.fullmatch(line):
                  dropped.add(i)
                  continue
              for pattern, repl in inline:
                  line = pattern.sub(repl, line)
              lines.append(line)

          # The footer follows a horizontal rule. Drop that one rule, and only
          # when the footer was the last thing in the body: a body that merely
          # ends in a rule of its own keeps it.
          last = max((i for i, l in enumerate(orig) if l.strip()), default=None)
          while lines and not lines[-1].strip():
              lines.pop()
          if last in dropped and lines and lines[-1].strip() == "---":
              lines.pop()
              while lines and not lines[-1].strip():
                  lines.pop()
          clean = "\n".join(lines) + "\n" if lines else ""

          subprocess.run(
              ["gh", "api", "--method", "PATCH", endpoint, "--raw-field", f"body={clean}"],
              check=True,
          )
          PY

  commits:
    name: Session link - commits
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Fail if a commit carries a session link
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Compare against the base branch as it is now, not the SHA the event
          # recorded: a PR that has merged the base branch in must not be
          # blamed for commits that were already on it.
          git fetch --no-tags origin "$BASE_REF"
          bad="$(git log -i --format='%h %s' --grep='claude\.ai/code/session' "origin/$BASE_REF..$HEAD")"
          if [ -n "$bad" ]; then
            echo "::error::These commits carry a coding-session link; remove it from the message:"
            echo "$bad"
            exit 1
          fi
